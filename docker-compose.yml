# version: "3.8"
#
# The shared nginx-proxy + Let's Encrypt companion run on their own on the
# server (/opt/proxy, since 2026-11-21); the apps join its `app_network` with
# VIRTUAL_HOST / LETSENCRYPT_HOST.

services:
  database:
    image: mysql:8.0.32
    container_name: database
    restart: always
    environment:
      DATABASE_URL: mysql://root@database:3306/igraphical
      MYSQL_DATABASE: igraphical
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      - app_network

  admin:
    image: ghcr.io/ezlegin/igraphical-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        RESEND_API_KEY: ${RESEND_API_KEY}
    container_name: admin
    restart: always
    env_file:
      - /root/envs/igraphical/admin.env.local
    environment:
      VIRTUAL_PORT: 3000
      VIRTUAL_HOST: admin.igraphical.ir
      LETSENCRYPT_HOST: admin.igraphical.ir
      LETSENCRYPT_EMAIL: admin@igraphical.ir
      NEXTAUTH_URL: https://admin.igraphical.ir
      CLIENT_MAX_BODY_SIZE: 10m
      NODE_OPTIONS: --max-old-space-size=224
    mem_limit: 384m
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

  app:
    image: ghcr.io/ezlegin/igraphical-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/app/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        RESEND_API_KEY: ${RESEND_API_KEY}
    container_name: app
    restart: always
    env_file:
      - /root/envs/igraphical/app.env.local
    environment:
      VIRTUAL_PORT: 3000
      VIRTUAL_HOST: igraphical.ir
      LETSENCRYPT_HOST: igraphical.ir
      LETSENCRYPT_EMAIL: admin@igraphical.ir
      NEXTAUTH_URL: https://igraphical.ir
      CLIENT_MAX_BODY_SIZE: 10m
      NODE_OPTIONS: --max-old-space-size=320
    mem_limit: 512m
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

  # @obhco/pay housekeeping: calls the app's reconcile route every 5 minutes
  # over the internal network (CRON_SECRET_KEY comes from app.env.local)
  pay-reconcile:
    image: curlimages/curl:8.10.1
    container_name: pay-reconcile
    restart: always
    env_file:
      - /root/envs/igraphical/app.env.local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 300
          curl -fsS -m 120 -X POST -H "x-cron-key: $$CRON_SECRET_KEY" http://app:3000/api/pay/reconcile || echo "reconcile failed"
          echo
        done
    depends_on:
      - app
    networks:
      - app_network

volumes:
  database:

networks:
  app_network:
    external: true
