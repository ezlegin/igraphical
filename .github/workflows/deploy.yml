name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ezlegin

jobs:
  # Decides which apps need a new image: apps/<name>/** rebuilds only that app;
  # anything shared (packages/**, root package/lock/turbo files) rebuilds all.
  # Manual runs, new branches and force pushes rebuild all to be safe.
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ALL='["app","admin"]'
          if [ "$EVENT" = pull_request ]; then BASE="$PR_BASE"; else BASE="$BEFORE"; fi
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -qE '^(packages/|package\.json$|package-lock\.json$|turbo\.json$|\.npmrc$)'; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          picked=""
          for a in app admin; do
            if echo "$files" | grep -q "^apps/$a/"; then picked="$picked\"$a\","; fi
          done
          echo "apps=[${picked%,}]" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    # ARM only (linux/arm64), on the native ARM runner: the server is ARM
    # since 2026-11-21.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs only build (that is the type-check + lint + next build test);
      # main also pushes the image.
      - name: Build${{ github.event_name != 'pull_request' && ' & push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # :latest only from main; a manual run on another branch pushes :<sha>.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/igraphical-${{ matrix.app }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}/igraphical-{2}:latest', env.REGISTRY, env.OWNER, matrix.app) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Placeholders: the real runtime secrets come from /root/envs/igraphical/*.env.local
          # on the server. The build never connects to a database.
          build-args: |
            DATABASE_URL=mysql://root@database:3306/igraphical
            RESEND_API_KEY=re_build_placeholder
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: [changes, build]
    # also runs when nothing needed building (e.g. only docker-compose.yml changed)
    # Only main deploys; a manual run on another branch only builds.
    if: >-
      always() && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # The `igraphical-deploy` key (DEPLOY_USER) can only run
    # /opt/igraphical/deploy.sh-wrapper with a commit sha and the apps to
    # restart. scripts/deploy.sh, scripts/deploy.sh-wrapper and
    # docker-compose.yml are copied to the server by hand when they change.
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          SERVICES: ${{ join(fromJSON(needs.changes.outputs.apps), ' ') }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" "${{ github.sha }} $SERVICES"
